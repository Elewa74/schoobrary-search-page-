<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schoobrary Search</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #24364B;
      --ink-3: #0D3B7A;
      --text: #24364B;
      --bone: #F8FBFF;
      --paper: #FFFFFF;
      --blue: #3A7BD5;
      --blue-deep: #1565C0;
      --green: #3A9D5D;
      --butter: #F26A2E;
      --muted: #6B7C8F;
      --border: #D8E6F5;
      --mist: #D8E6F5;
      --shadow-md: 0 10px 32px rgba(58,123,213,.14);
      --shadow-lg: 0 24px 70px rgba(36,54,75,.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bone);
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
    }
    .display { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      height: 40px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--blue); color: var(--blue); }
    .chip.dark {
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.30);
      color: #fff;
      backdrop-filter: blur(8px);
    }
    .chip.dark.on { background: var(--butter); border-color: var(--butter); color: #fff; }

    .btn {
      border: 0;
      border-radius: 999px;
      height: 46px;
      padding: 0 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--mist); }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    header.app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(248,251,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-row {
      height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-box { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 86% 18%, rgba(84,181,63,.16), transparent 34%), linear-gradient(135deg, var(--ink-3), var(--blue), var(--green));
      color: #fff;
      padding: 80px 0 100px;
    }
    .hero h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(36px, 6vw, 72px);
      line-height: 1.1;
    }
    .hero p {
      margin: 16px auto 0;
      max-width: 700px;
      text-align: center;
      color: rgba(255,255,255,.85);
      line-height: 1.7;
      font-size: 17px;
    }

    .search-shell { max-width: 900px; margin: 34px auto 0; }
    .search-bar {
      background: #fff;
      border-radius: 999px;
      padding: 7px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 30px 80px rgba(13,34,64,.35);
    }
    .search-input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      height: 50px;
      font-size: 15px;
      color: var(--text);
      text-align: right;
      font-family: inherit;
    }
    .filter-triggers {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .filter-triggers .chip { min-height: 46px; padding-inline: 18px; font-size: 15px; }

    .drawer-wrap {
      max-width: 1160px;
      margin: -56px auto 0;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }
    .drawer-card { padding: 22px; }
    .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .drawer-title { margin: 0; font-size: clamp(24px, 4vw, 42px); color: var(--ink); }
    .drawer-sub { margin: 8px 0 0; color: var(--muted); font-size: clamp(14px, 2vw, 20px); }
    .field-grid-5, .field-grid-4 { display: grid; gap: 10px; }
    .field-grid-5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
    .field-grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .select {
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      font-family: inherit;
    }
    .select.active { border-color: var(--blue); background: rgba(58,123,213,.08); }

    .results { padding: 52px 0 24px; }
    .results h2 { margin: 8px 0 0; font-size: clamp(24px,4vw,32px); }
    .meta-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 20px; padding-bottom: 18px; border-bottom: 1px solid var(--mist); }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
    }
    .result-top {
      height: 120px;
      border-radius: 16px 16px 0 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
    }
    .result-body { padding: 14px; }
    .curriculum-inline {
      width: 100%;
      min-height: 1120px;
      border: 0;
      border-radius: 16px;
      background: #f5f7fa;
      box-shadow: var(--shadow-md);
    }

    .browse { padding: 50px 0 80px; }
    .browse-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
    }
    .browse-media { height: 130px; position: relative; overflow: hidden; border-radius: 16px 16px 0 0; }
    .browse-media img { width: 100%; height: 100%; object-fit: cover; opacity: .82; }
    .browse-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(13,59,122,.12), rgba(13,59,122,.62));
    }
    .browse-label {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255,255,255,.95);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .browse-body { padding: 14px; }

    @media (max-width: 1100px) {
      .result-grid, .browse-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .field-grid-5 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    @media (max-width: 900px) {
      .container { padding: 0 16px; }
      .hero { padding: 64px 0 82px; }
      .search-bar { border-radius: 20px; }
      .search-shell { max-width: 100%; }
      .drawer-wrap { padding: 0 16px; }
      .field-grid-4, .field-grid-5 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .result-grid, .browse-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 600px) {
      .header-row { height: 64px; }
      .hero h1 { font-size: clamp(28px, 9vw, 40px); }
      .hero p { font-size: 14px; }
      .search-bar {
        flex-direction: column;
        align-items: stretch;
        border-radius: 16px;
      }
      .search-input { height: 44px; }
      .filter-triggers { justify-content: stretch; }
      .filter-triggers .chip { width: 100%; justify-content: center; }
      .field-grid-4, .field-grid-5 { grid-template-columns: 1fr; }
      .result-grid, .browse-grid { grid-template-columns: 1fr; }
      .drawer-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const RESULTS = [
      { t: "شرح المعادلات الخطية", s: "الرياضيات", g: "الأول المتوسط", c: "السعودية · الوزارة", d: "linear-gradient(160deg,#0070B0 0%, #0A2740 100%)" },
      { t: "أساسيات العلوم", s: "العلوم", g: "السادس", c: "الإمارات · الوزارة", d: "linear-gradient(160deg,#3FB0B0 0%, #1A6A6A 100%)" },
      { t: "اختبار نهاية الدرس", s: "الرياضيات", g: "الثاني المتوسط", c: "السعودية", d: "linear-gradient(160deg,#80C030 0%, #4A7A14 100%)" },
      { t: "ملخص الدرس الأول", s: "اللغة العربية", g: "الخامس", c: "الكويت", d: "linear-gradient(160deg,#F2D096 0%, #C98A2B 100%)" },
    ];
    function App() {
      const [query, setQuery] = React.useState("");
      const [openDrawer, setOpenDrawer] = React.useState(null);
      const [topicSelected, setTopicSelected] = React.useState(false);
      const [currSelected, setCurrSelected] = React.useState(false);
      const [showResults, setShowResults] = React.useState(false);

      const hasFilters = topicSelected || currSelected || query.trim().length > 0;

      const applyDrawer = () => {
        if (openDrawer === "topic") setTopicSelected(true);
        if (openDrawer === "curriculum") setCurrSelected(true);
        setShowResults(true);
        setOpenDrawer(null);
      };

      return (
        <>
          <header className="app-header">
            <div className="container header-row">
              <img src="design-system/assets/logo-horizontal-schoobrary.png" alt="Schoobrary" style={{ height: 40, width: "auto" }} />
              <div className="user-box">
                <div className="avatar">ME</div>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>Moamen Elewa</div>
                  <div style={{ fontSize: 11, color: "var(--muted)" }}>حسابي</div>
                </div>
              </div>
            </div>
          </header>

          <section className="hero">
            <div className="container">
              <h1 className="display">ابحث في سكوبراري</h1>
              <p>اكتشف الكتب، الفيديوهات، الأسئلة، البطاقات، الصور، المقالات، وخطط الدروس من مكان واحد.</p>
              <div className="search-shell">
                <div className="search-bar">
                  <button className="btn btn-primary" onClick={() => setShowResults(true)}>بحث</button>
                  <input className="search-input" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ابحث عن موضوع، مادة، درس، سؤال، كتاب أو نوع مورد..." />
                </div>
                <div className="filter-triggers">
                  <button className={`chip dark ${openDrawer==="topic"?"on":""}`} onClick={() => setOpenDrawer(openDrawer==="topic"?null:"topic")}>الموضوع</button>
                  <button className={`chip dark ${openDrawer==="curriculum"?"on":""}`} onClick={() => setOpenDrawer(openDrawer==="curriculum"?null:"curriculum")}>المنهج</button>
                </div>
              </div>
            </div>
          </section>

          {openDrawer && (
            <div className="drawer-wrap">
              <div className="card drawer-card">
                <div className="drawer-head">
                  <div>
                    <h3 className="display drawer-title">{openDrawer === "topic" ? "الموضوع أو المادة" : "الدولة / المنهج"}</h3>
                    <p className="drawer-sub">
                      {openDrawer === "topic" && "حدد المادة أو الموضوع للوصول إلى الموارد التعليمية المرتبطة به."}
                      {openDrawer === "curriculum" && "اختر الدولة والمنهج والصف للوصول إلى موارد مرتبطة بالمقرر الدراسي."}
                    </p>
                  </div>
                  <button className="btn btn-ghost" onClick={() => setOpenDrawer(null)}>إغلاق</button>
                </div>

                {openDrawer === "topic" && (
                  <div className="field-grid-4">
                    {[
                      ["الموضوع الرئيسي","الجبر",true],["المجال","",false],["المحور","",false],["الموضوع الفرعي","",false]
                    ].map(([label,value,active]) => (
                      <div className="field" key={label}>
                        <div className="field-label">{label}</div>
                        <div className={`select ${active ? "active":""}`}><span>{value || "اختر..."}</span><span>▾</span></div>
                      </div>
                    ))}
                  </div>
                )}

                {openDrawer === "curriculum" && (
                  <div className="field-grid-4">
                    {[
                      ["الدولة","السعودية",true],["المنهج","وزارة التعليم",true],["الصف الدراسي","الأول المتوسط",true],["المادة","الرياضيات",true]
                    ].map(([label,value,active]) => (
                      <div className="field" key={label}>
                        <div className="field-label">{label}</div>
                        <div className={`select ${active ? "active":""}`}><span>{value || "اختر..."}</span><span>▾</span></div>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{display:"flex",justifyContent:"flex-start",gap:12,marginTop:18,paddingTop:18,borderTop:"1px solid var(--mist)"}}>
                  <button className="btn" style={{background:"var(--butter)",color:"#fff"}} onClick={applyDrawer}>بحث</button>
                  <button className="btn btn-ghost">إعادة تعيين</button>
                </div>
              </div>
            </div>
          )}

          {showResults && (
            <section className="results">
              <div className="container">
                <iframe className="curriculum-inline" src="curriculum.html" title="نتائج المنهج"></iframe>
              </div>
            </section>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
