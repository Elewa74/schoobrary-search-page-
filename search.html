      --green: #3A9D5D;
      --butter: #F26A2E;
      --muted: #6B7C8F;
      --border: #D8E6F5;

      --shadow-lg: 0 24px 70px rgba(36,54,75,.18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bone);
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
    }
    .display { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      height: 40px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--blue); color: var(--blue); }
    .chip.dark {
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.30);
      color: #fff;
      backdrop-filter: blur(8px);
    }
    .chip.dark.on { background: var(--butter); border-color: var(--butter); color: #fff; }

    .btn {
      border: 0;
      border-radius: 999px;
      height: 46px;
      padding: 0 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--mist); }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    header.app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(248,251,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-row {

      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-box { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 86% 18%, rgba(84,181,63,.16), transparent 34%), linear-gradient(135deg, var(--ink-3), var(--blue), var(--green));
      color: #fff;
      padding: 80px 0 100px;

    .hero h1 {

      text-align: center;

    .hero p {

      max-width: 700px;
      text-align: center;
      color: rgba(255,255,255,.85);
      line-height: 1.7;
      font-size: 17px;

    .search-bar {
      background: #fff;
      border-radius: 999px;
      padding: 7px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 30px 80px rgba(13,34,64,.35);

    .search-input {

      border: 0;

      background: transparent;
      height: 50px;
      font-size: 15px;
      color: var(--text);
      text-align: right;
      font-family: inherit;

      margin-top: 16px;

      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .filter-triggers .chip { min-height: 46px; padding-inline: 18px; font-size: 15px; }

    .drawer-wrap {
      max-width: 1160px;
      margin: -56px auto 0;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }
    .drawer-card { padding: 22px; }
    .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .drawer-title { margin: 0; font-size: clamp(24px, 4vw, 42px); color: var(--ink); }
    .drawer-sub { margin: 8px 0 0; color: var(--muted); font-size: clamp(14px, 2vw, 20px); }
    .field-grid-5, .field-grid-4 { display: grid; gap: 10px; }
    .field-grid-5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
    .field-grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .select {
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      font-family: inherit;
    }
    .select.active { border-color: var(--blue); background: rgba(58,123,213,.08); }

    .results { padding: 52px 0 24px; }

    .meta-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 20px; padding-bottom: 18px; border-bottom: 1px solid var(--mist); }
    .popular { margin-bottom: 18px; }
    .popular-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
    }
    .result-top {
      height: 120px;
      border-radius: 16px 16px 0 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
    }
    .result-body { padding: 14px; }

    .browse { padding: 50px 0 80px; }
    .browse-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
    }
    .browse-media { height: 130px; position: relative; overflow: hidden; border-radius: 16px 16px 0 0; }
    .browse-media img { width: 100%; height: 100%; object-fit: cover; opacity: .82; }
    .browse-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(13,59,122,.12), rgba(13,59,122,.62));

    .browse-label {
      position: absolute;
      bottom: 10px;
      right: 10px;

      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;

    .browse-body { padding: 14px; }

    @media (max-width: 1100px) {

      .field-grid-5 { grid-template-columns: repeat(3, minmax(0,1fr)); }

    @media (max-width: 900px) {
      .container { padding: 0 16px; }

      .drawer-wrap { padding: 0 16px; }
      .field-grid-4, .field-grid-5 { grid-template-columns: repeat(2, minmax(0,1fr)); }

      .drawer-card { padding: 16px; }

  </style>
</head>
